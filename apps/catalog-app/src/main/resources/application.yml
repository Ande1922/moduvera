server:
  port: ${CATALOG_PORT:8082}

spring:
  application:
    name: catalog-app
  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/catalog}
    username: ${CATALOG_DB_USERNAME:catalog}
    password: ${CATALOG_DB_PASSWORD:catalog}
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${IDENTITY_ISSUER_URI:http://localhost:8081}
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/oauth2/jwks}
          audiences:
            - catalog-service

management:
  endpoints:
    web:
      exposure:
        include: health,info

moduvera:
  database:
    migration:
      mode: startup
      initialize: true
