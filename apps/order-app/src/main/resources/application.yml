spring:
  application:
    name: order-app
  datasource:
    url: ${ORDER_DATABASE_URL:jdbc:postgresql://localhost:5432/order}
    username: ${ORDER_DATABASE_USERNAME:order}
    password: ${ORDER_DATABASE_PASSWORD}
  flyway:
    enabled: false
  http:
    clients:
      imperative:
        factory: http-components
    serviceclient:
      catalog:
        base-url: ${CATALOG_BASE_URL}
        connect-timeout: ${CATALOG_CONNECT_TIMEOUT:2s}
        read-timeout: ${CATALOG_READ_TIMEOUT:2s}
      identity:
        base-url: ${IDENTITY_BASE_URL}
        connect-timeout: ${IDENTITY_CONNECT_TIMEOUT:2s}
        read-timeout: ${IDENTITY_READ_TIMEOUT:2s}
  cloud:
    function:
      definition: inventoryResult
    stream:
      bindings:
        reserveInventory-out-0:
          destination: ${INVENTORY_RESERVE_TOPIC:inventory-reserve}
          producer:
            use-native-encoding: true
        inventoryResult-in-0:
          destination: ${INVENTORY_RESULT_TOPIC:inventory-result}
          group: order-service
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}
        bindings:
          reserveInventory-out-0:
            producer:
              sync: true
              configuration:
                acks: all
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
                value.serializer: org.apache.kafka.common.serialization.ByteArraySerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${IDENTITY_ISSUER_URI:http://localhost:8081}
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/oauth2/jwks}
          audiences: [order-service]
moduvera:
  database:
    migration:
      mode: validate
  identifier:
    worker-id: ${MODUVERA_IDENTIFIER_WORKER_ID}
  reference:
    clients:
      identity:
        service-id: ${ORDER_SERVICE_ID:order-service}
        service-secret: ${ORDER_SERVICE_SECRET}
  messaging:
    kafka:
      consumer-bindings: [inventoryResult-in-0]
      routes:
        inventory.reserve: reserveInventory-out-0
server:
  port: ${SERVER_PORT:8083}
management:
  endpoints:
    web:
      exposure:
        include: health,info
